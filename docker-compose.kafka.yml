services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: tcc-kafka
    restart: unless-stopped
    ports:
      - "9092:9092" # Acesso externo (host / benchmark)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - tcc-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  ingest-service:
    build:
      context: .
      dockerfile: services/ingest-service/Dockerfile
    container_name: tcc-ingest-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      SERVICE_NAME: ingest-service
      EVENT_BUS_DRIVER: kafka
      KAFKA_BROKERS: kafka:29092
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_TELEMETRY_TOPIC: sensors/+/telemetry
    depends_on:
      kafka:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - tcc-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  persistence-service:
    build:
      context: .
      dockerfile: services/persistence-service/Dockerfile
    container_name: tcc-persistence-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      SERVICE_NAME: persistence-service
      EVENT_BUS_DRIVER: kafka
      KAFKA_BROKERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-tcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcc}
      POSTGRES_DB: ${POSTGRES_DB:-tcc_monitoring}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-tcc-super-secret-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-tcc-ufba}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-telemetry}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      - tcc-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  kafka_data:

networks:
  tcc-network:
    name: tcc-network
    driver: bridge
